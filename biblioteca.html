<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca · Colégio Estadual Unidade Polo</title>
<style>
  :root {
    --papel: #f6f1e8;
    --papel-escuro: #ede6d6;
    --papel-borda: #ddd3bf;
    --tinta: #1c1712;
    --tinta-suave: #4a3f33;
    --tinta-clara: #877b69;
    --musgo: #3d5a3d;
    --musgo-escuro: #2a3f2a;
    --terracota: #a8563c;
    --dourado: #b89155;
    --dourado-escuro: #8f6f3e;
    --creme-card: #fcf8ef;
    --borda-fina: #d4c9b2;
    --sombra: 0 1px 3px rgba(28,23,18,.06), 0 4px 16px rgba(28,23,18,.04);
    --sombra-forte: 0 4px 28px rgba(28,23,18,.12);
    --serif: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, 'Times New Roman', serif;
    --sans: 'Optima', 'Segoe UI', -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--papel);
    color: var(--tinta);
    font-size: 15px;
    line-height: 1.6;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(184,145,85,.05) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(61,90,61,.04) 0%, transparent 40%);
    background-attachment: fixed;
  }

  /* ================= LOGIN ================= */
  .login-screen {
    position: fixed; inset: 0;
    background: var(--papel);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 1000;
    overflow-y: auto;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(184,145,85,.05) 40px);
  }
  .login-box {
    background: var(--creme-card);
    max-width: 440px; width: 100%;
    padding: 40px 40px 36px;
    border: 1px solid var(--borda-fina);
    box-shadow: var(--sombra-forte);
    position: relative;
    text-align: center;
    margin: auto;
  }
  .login-box::before { content: ''; position: absolute; inset: 8px; border: 1px solid var(--borda-fina); pointer-events: none; }
  .login-box::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--dourado), var(--musgo), var(--dourado)); }
  .login-brasao { width: 60px; height: 60px; margin: 0 auto 16px; border-radius: 50%; background: var(--papel-escuro); border: 2px solid var(--dourado); display: grid; place-items: center; font-family: var(--serif); font-style: italic; font-size: 1.2rem; color: var(--musgo); box-shadow: inset 0 0 0 4px var(--creme-card); }
  .login-exlibris { font-family: var(--sans); font-size: .6rem; letter-spacing: .4em; text-transform: uppercase; color: var(--dourado-escuro); margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--borda-fina); }
  .login-marca { font-family: var(--serif); font-size: 1.3rem; line-height: 1.3; font-weight: 400; color: var(--tinta); margin-bottom: 8px; }
  .login-marca em { font-style: italic; color: var(--musgo); display: block; font-size: 1.6rem; margin-top: 2px; }
  .login-sub { font-family: var(--serif); font-style: italic; color: var(--tinta-clara); font-size: .85rem; margin-bottom: 20px; }
  .ornamento { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--dourado); font-size: .7rem; letter-spacing: .35em; }
  .ornamento::before, .ornamento::after { content: ''; flex: 1; height: 1px; background: var(--borda-fina); }
  .perfil-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .perfil-card { padding: 20px 12px; background: var(--papel); border: 1px solid var(--borda-fina); cursor: pointer; transition: all .2s ease; text-align: center; font-family: inherit; position: relative; }
  .perfil-card:hover { background: var(--creme-card); border-color: var(--musgo); transform: translateY(-2px); box-shadow: var(--sombra); }
  .perfil-card:hover::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--dourado); }
  .perfil-card .simbolo { font-family: var(--serif); font-size: 1.5rem; color: var(--musgo); display: block; margin-bottom: 6px; font-style: italic; }
  .perfil-card h3 { font-family: var(--serif); font-weight: 400; font-size: 1rem; color: var(--tinta); margin-bottom: 2px; }
  .perfil-card small { color: var(--tinta-clara); font-size: .7rem; font-family: var(--sans); }
  .login-aluno-box { display: none; animation: fadeIn .2s; flex-direction: column; gap: 10px; margin-bottom: 10px; }
  .login-aluno-box.ativo { display: flex; }
  .btn-entrar { width: 100%; padding: 12px; background: var(--musgo); color: var(--creme-card); border: none; font-family: var(--serif); font-size: .95rem; letter-spacing: .1em; text-transform: uppercase; cursor: pointer; transition: .2s; display: none; margin-top: 10px; }
  .btn-entrar:hover { background: var(--musgo-escuro); }
  .senha-box { display: none; animation: fadeIn .2s; max-width: 280px; margin: 0 auto; }
  .senha-box.ativo { display: block; }
  .senha-label { font-family: var(--serif); font-style: italic; font-size: .85rem; color: var(--tinta-clara); text-align: left; margin-bottom: 4px; display: block; }
  .senha-input { width: 100%; padding: 12px; background: var(--papel); border: 1px solid var(--borda-fina); font-family: var(--sans); font-size: .95rem; color: var(--tinta); margin-bottom: 10px; letter-spacing: .15em; text-align: center; }
  .senha-input:focus { outline: none; border-color: var(--musgo); }
  .senha-erro { background: #f8e5df; border: 1px solid var(--terracota); color: var(--terracota); font-family: var(--serif); font-style: italic; font-size: .8rem; padding: 8px 12px; margin-bottom: 10px; text-align: center; }
  .btn-esqueci { background: transparent; border: none; color: var(--tinta-clara); font-family: var(--serif); font-style: italic; font-size: .8rem; cursor: pointer; text-decoration: underline; margin-top: 8px; padding: 4px; display: none; }
  .btn-esqueci:hover { color: var(--musgo); }
  .btn-voltar-login { background: transparent; border: none; color: var(--tinta-clara); font-family: var(--serif); font-size: .8rem; cursor: pointer; margin-top: 8px; padding: 4px; }
  .btn-voltar-login:hover { color: var(--terracota); }

  /* ================= APP ================= */
  .app { display: none; min-height: 100vh; }
  .app.active { display: flex; }
  .sidebar { width: 270px; background: var(--papel-escuro); border-right: 1px solid var(--borda-fina); padding: 32px 22px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .marca { padding-bottom: 22px; border-bottom: 1px solid var(--borda-fina); margin-bottom: 24px; }
  .marca h1 { font-family: var(--serif); font-size: 1.1rem; font-weight: 400; color: var(--tinta); line-height: 1.35; }
  .marca h1 em { font-style: italic; color: var(--musgo); font-size: 1.15rem; }
  .marca small { font-size: .65rem; letter-spacing: .3em; text-transform: uppercase; color: var(--dourado-escuro); display: block; margin-top: 10px; font-family: var(--sans); }
  .user-badge { display: flex; align-items: center; gap: 12px; padding: 12px 0 20px; margin-bottom: 20px; border-bottom: 1px solid var(--borda-fina); }
  .user-badge .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--musgo); color: var(--creme-card); display: grid; place-items: center; font-family: var(--serif); font-style: italic; font-size: 1.1rem; flex-shrink: 0; border: 1.5px solid var(--dourado); }
  .user-badge strong { display: block; font-family: var(--serif); font-weight: 400; font-size: .95rem; color: var(--tinta); line-height: 1.2; }
  .user-badge small { font-size: .7rem; color: var(--tinta-clara); display: block; margin-top: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border: none; background: transparent; font-family: var(--sans); font-size: .9rem; color: var(--tinta-suave); cursor: pointer; text-align: left; width: 100%; border-bottom: 1px solid transparent; transition: .15s; }
  .nav-item:hover { color: var(--musgo); padding-left: 8px; }
  .nav-item.active { color: var(--musgo); border-bottom-color: var(--musgo); font-weight: 600; }
  .nav-item .simbolo { font-family: var(--serif); font-style: italic; width: 18px; color: var(--tinta-clara); font-size: 1rem; }
  .nav-item.active .simbolo { color: var(--musgo); }
  .nav-badge { margin-left: auto; background: var(--terracota); color: var(--creme-card); font-family: var(--sans); font-size: .68rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .sidebar-footer { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--borda-fina); display: flex; flex-direction: column; gap: 8px; }
  .btn-sair, .btn-trocar-senha { padding: 10px; background: transparent; color: var(--tinta-clara); border: 1px solid var(--borda-fina); font-family: var(--sans); font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; transition: .2s; }
  .btn-sair:hover { color: var(--terracota); border-color: var(--terracota); }
  .btn-trocar-senha:hover { color: var(--musgo); border-color: var(--musgo); }
  .main { flex: 1; padding: 44px 56px; max-width: 1120px; overflow-x: hidden; }
  .escola-tag { display: flex; align-items: center; gap: 12px; font-family: var(--sans); font-size: .65rem; letter-spacing: .35em; text-transform: uppercase; color: var(--dourado-escuro); margin-bottom: 14px; }
  .escola-tag::before { content: ''; width: 24px; height: 1px; background: var(--dourado); }
  .page-header { margin-bottom: 38px; padding-bottom: 22px; border-bottom: 1px solid var(--borda-fina); display: flex; align-items: flex-end; gap: 20px; }
  .page-title { font-family: var(--serif); font-size: 2.1rem; font-weight: 400; letter-spacing: -.015em; color: var(--tinta); line-height: 1.15; }
  .page-title em { font-style: italic; color: var(--musgo); }
  .page-sub { font-family: var(--serif); font-style: italic; color: var(--tinta-clara); font-size: .95rem; margin-top: 8px; }
  .sino { margin-left: auto; position: relative; font-family: var(--serif); font-size: 1.4rem; color: var(--tinta-suave); cursor: pointer; padding: 6px 10px; border: 1px solid var(--borda-fina); background: var(--creme-card); transition: .2s; }
  .sino:hover { color: var(--musgo); border-color: var(--musgo); }
  .sino .contador { position: absolute; top: -8px; right: -8px; background: var(--terracota); color: var(--creme-card); font-family: var(--sans); font-size: .68rem; font-weight: 700; padding: 2px 7px; border-radius: 10px; min-width: 20px; text-align: center; animation: pulse 2s infinite; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 36px; border-top: 1px solid var(--borda-fina); border-bottom: 1px solid var(--borda-fina); }
  .stat-card { padding: 24px 20px; border-right: 1px solid var(--borda-fina); text-align: left; }
  .stat-card:last-child { border-right: none; }
  .stat-card .label { font-size: .68rem; letter-spacing: .22em; text-transform: uppercase; color: var(--tinta-clara); font-weight: 600; margin-bottom: 10px; }
  .stat-card .valor { font-family: var(--serif); font-size: 2.2rem; font-weight: 400; color: var(--tinta); line-height: 1; }
  .stat-card .valor em { font-style: italic; color: var(--musgo); }
  .card { background: var(--creme-card); border: 1px solid var(--borda-fina); padding: 28px; margin-bottom: 24px; box-shadow: var(--sombra); }
  .card-header { display: flex; align-items: baseline; gap: 12px; padding-bottom: 14px; margin-bottom: 20px; border-bottom: 1px solid var(--borda-fina); }
  .card-header h2 { font-family: var(--serif); font-weight: 400; font-size: 1.25rem; color: var(--tinta); }
  .card-header .num { font-family: var(--serif); font-style: italic; color: var(--dourado); font-size: 1rem; margin-left: auto; }
  .form-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  input, select, textarea { width: 100%; padding: 11px 13px; background: var(--papel); border: 1px solid var(--borda-fina); font-family: var(--sans); font-size: .92rem; color: var(--tinta); transition: .15s; border-radius: 0; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--musgo); background: var(--creme-card); }
  input[readonly] { background: var(--papel-escuro); cursor: not-allowed; }
  .btn { padding: 11px 20px; border: 1px solid transparent; font-family: var(--sans); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; cursor: pointer; transition: .2s; white-space: nowrap; }
  .btn-primary { background: var(--musgo); color: var(--creme-card); border-color: var(--musgo); }
  .btn-primary:hover { background: var(--musgo-escuro); }
  .btn-primary:disabled { background: var(--papel-escuro); color: var(--tinta-clara); border-color: var(--borda-fina); cursor: not-allowed; }
  .btn-danger { background: transparent; color: var(--terracota); border-color: var(--borda-fina); }
  .btn-danger:hover { border-color: var(--terracota); }
  .btn-ghost { background: transparent; color: var(--musgo); border-color: var(--borda-fina); }
  .btn-ghost:hover { border-color: var(--musgo); background: var(--papel); }
  .btn-sm { padding: 6px 12px; font-size: .7rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 14px 8px; text-align: left; border-bottom: 1px solid var(--borda-fina); font-size: .9rem; }
  th { font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; color: var(--tinta-clara); font-weight: 600; }
  td { color: var(--tinta-suave); }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: rgba(184,145,85,.05); }
  .matricula-cell { font-family: var(--serif); color: var(--musgo); font-weight: 600; }
  .badge { display: inline-block; padding: 3px 10px; font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; border: 1px solid currentColor; }
  .badge-green { color: var(--musgo); }
  .badge-red { color: var(--terracota); }
  .badge-blue { color: #4a6b8a; }
  .badge-yellow { color: #9c7b2a; }
  .livros-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .livro-card { background: var(--papel); border: 1px solid var(--borda-fina); padding: 22px; transition: .25s; display: flex; flex-direction: column; position: relative; cursor: pointer; }
  .livro-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--dourado); }
  .livro-card:hover { background: var(--creme-card); box-shadow: var(--sombra); transform: translateY(-2px); }
  .livro-genero { font-family: var(--serif); font-style: italic; font-size: .82rem; color: var(--tinta-clara); margin-bottom: 6px; }
  .livro-card h3 { font-family: var(--serif); font-size: 1.15rem; font-weight: 400; line-height: 1.25; color: var(--tinta); margin-bottom: 4px; }
  .livro-card .autor { font-size: .85rem; color: var(--tinta-suave); margin-bottom: 14px; font-style: italic; }
  .livro-card .estoque { font-size: .82rem; color: var(--tinta-suave); padding: 10px 0; margin-top: auto; border-top: 1px solid var(--borda-fina); }
  .ficha-header { background: var(--papel-escuro); border: 1px solid var(--borda-fina); padding: 32px; margin-bottom: 28px; display: flex; align-items: center; gap: 24px; position: relative; }
  .ficha-header::before { content: ''; position: absolute; top: 8px; left: 8px; right: 8px; bottom: 8px; border: 1px solid var(--borda-fina); pointer-events: none; }
  .avatar-grande { width: 76px; height: 76px; border-radius: 50%; background: var(--musgo); color: var(--creme-card); display: grid; place-items: center; font-family: var(--serif); font-style: italic; font-size: 1.9rem; flex-shrink: 0; border: 2px solid var(--dourado); }
  .ficha-header h2 { font-family: var(--serif); font-weight: 400; font-size: 1.7rem; color: var(--tinta); }
  .ficha-header p { font-family: var(--serif); font-style: italic; color: var(--tinta-clara); font-size: .95rem; }
  .ficha-header .matricula-tag { display: inline-block; font-family: var(--serif); font-style: normal; font-size: .8rem; background: var(--creme-card); color: var(--musgo); border: 1px solid var(--borda-fina); padding: 3px 10px; margin-left: 8px; font-weight: 600; }
  .avaliacao-item { padding: 16px 0; border-bottom: 1px solid var(--borda-fina); }
  .avaliacao-item:last-child { border-bottom: none; }
  .avaliacao-item strong { font-family: var(--serif); font-weight: 400; font-size: 1.05rem; color: var(--tinta); display: block; margin-bottom: 4px; }
  .stars { color: var(--dourado); font-size: 1.1rem; letter-spacing: .12em; margin-bottom: 6px; }
  .avaliacao-item p { font-family: var(--serif); font-style: italic; color: var(--tinta-suave); font-size: .95rem; margin: 6px 0; }
  .avaliacao-item .data { font-size: .7rem; color: var(--tinta-clara); letter-spacing: .15em; text-transform: uppercase; }
  .empty { text-align: center; padding: 40px 20px; color: var(--tinta-clara); font-family: var(--serif); font-style: italic; font-size: .95rem; }
  .genero-titulo { grid-column: 1/-1; font-family: var(--serif); font-size: 1.1rem; color: var(--tinta); margin: 24px 0 4px; padding-bottom: 8px; border-bottom: 1px solid var(--borda-fina); display: flex; align-items: baseline; gap: 10px; }
  .genero-titulo:first-child { margin-top: 0; }
  .genero-titulo em { font-style: italic; font-size: .76rem; color: var(--tinta-clara); margin-left: auto; letter-spacing: .14em; text-transform: uppercase; }
  .solicitacao-card { background: var(--papel); border: 1px solid var(--borda-fina); border-left: 4px solid var(--dourado); padding: 20px; margin-bottom: 14px; }
  .solicitacao-card.pendente { border-left-color: var(--terracota); }
  .solicitacao-card.aprovada { border-left-color: var(--musgo); }
  .solicitacao-card.recusada { border-left-color: var(--tinta-clara); opacity: .75; }
  .solicitacao-card .topo { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .solicitacao-card .topo h3 { font-family: var(--serif); font-weight: 400; font-size: 1.05rem; color: var(--tinta); }
  .solicitacao-card .topo .data { margin-left: auto; font-size: .7rem; color: var(--tinta-clara); text-transform: uppercase; }
  .solicitacao-card .meta { font-family: var(--serif); font-style: italic; font-size: .85rem; color: var(--tinta-suave); margin-bottom: 12px; }
  .solicitacao-card .motivo { background: var(--creme-card); border: 1px dashed var(--borda-fina); padding: 10px 14px; font-family: var(--serif); font-style: italic; font-size: .88rem; margin: 10px 0; }
  .solicitacao-card .acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .form-ajuda { color: var(--tinta-clara); font-family: var(--serif); font-style: italic; font-size: .82rem; margin-top: 12px; }
  .matricula-wrap { display: flex; gap: 6px; align-items: stretch; }
  .matricula-wrap input { flex: 1; }
  .matricula-wrap .btn-regen { padding: 0 14px; background: var(--papel); border: 1px solid var(--borda-fina); color: var(--musgo); cursor: pointer; transition: .2s; }
  .matricula-wrap .btn-regen:hover { background: var(--creme-card); border-color: var(--musgo); }
  .import-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px dashed var(--borda-fina); }
  .preview-table { background: var(--papel); border: 1px solid var(--borda-fina); overflow-x: auto; }
  .preview-table table { font-size: .85rem; }
  .preview-table th, .preview-table td { padding: 10px 12px; }
  .preview-table tr.dup td { background: #f8e5df; }
  .preview-table .status-ok { color: var(--musgo); font-weight: 700; font-size: .73rem; }
  .preview-table .status-dup { color: var(--terracota); font-weight: 700; font-size: .73rem; }
  .preview-resumo { display: flex; gap: 20px; align-items: center; background: var(--papel-escuro); border: 1px solid var(--borda-fina); padding: 14px 20px; margin-bottom: 16px; font-family: var(--serif); }
  .preview-resumo .btn { margin-left: auto; }
  .btn-x { background: transparent; border: none; color: var(--terracota); cursor: pointer; font-size: 1.1rem; padding: 2px 6px; }
  .btn-x:hover { color: #7a3a26; transform: scale(1.15); }
  .aviso-import { background: var(--papel-escuro); border-left: 3px solid var(--dourado); padding: 12px 16px; margin-bottom: 16px; font-family: var(--serif); font-size: .88rem; font-style: italic; }
  .modal-bg { position: fixed; inset: 0; background: rgba(28,23,18,.45); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
  .modal-bg.ativo { display: flex; animation: fadeIn .2s; }
  .modal { background: var(--creme-card); border: 1px solid var(--borda-fina); max-width: 500px; width: 100%; padding: 32px; box-shadow: var(--sombra-forte); position: relative; max-height: 90vh; overflow-y: auto; }
  .modal::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--dourado), var(--musgo), var(--dourado)); }
  .modal h2 { font-family: var(--serif); font-weight: 400; font-size: 1.35rem; margin-bottom: 6px; color: var(--tinta); }

<!-- Supabase e Lógica -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
 /* ============ CONEXÃO SUPABASE ============ */
  const SUPABASE_URL = 'https://jaeugzqorximwjuzqilp.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphZXVnenFvcnhpbXdqdXpxaWxwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2Mzk0MTMsImV4cCI6MjEwODIxNTQxM30.NM3iYYO2lyC-Ve-YFAVjhVDK427EKfBXf_FUbqwVpKg';
  // MUDANÇA AQUI: O nome da variável passou a ser 'db' para não conflitar com o SDK.
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


  /* ============ ESTADO GLOBAL ============ */
  let alunos = [];
  let livros = [];
  let emprestimos = [];
  let avaliacoes = [];
  let solicitacoes = []; 
  let avisosAlunos = JSON.parse(localStorage.getItem('bib_avisos') || '[]');
  
  let importState = { alunos: null, livros: null };
  let sessao = { tipo: null, alunoId: null, pagina: 'painel' };

  /* ============ FUNÇÕES AUXILIARES ============ */
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const hoje = () => new Date().toISOString().slice(0,10);
  const fmtData = (d) => d ? d.split('-').reverse().join('.') : '—';
  const estrelas = (n) => '★'.repeat(n) + '☆'.repeat(5-n);
  const nomeAluno = (id) => alunos.find(a => a.id === id)?.nome || '—';
  const nomeLivro = (id) => livros.find(l => l.id === id)?.titulo || '—';
  const iniciais = (nome) => nome.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
  const norm = (s) => (s || '').toString().trim().toLowerCase().replace(/\s+/g, ' ').normalize('NFD').replace(/[\u0300-\u036f]/g, "");

  /* ============ CARREGAR DADOS DO SUPABASE ============ */
  async function carregarDados() {
    const { data: aData, error: aErr } = await db.from('alunos').select('*').order('nome');
    if (!aErr) alunos = aData || [];

    const { data: lData, error: lErr } = await db.from('livros').select('*').order('titulo');
    if (!lErr) livros = lData || [];

    const { data: eData, error: eErr } = await db.from('emprestimos').select('*');
    if (!eErr) emprestimos = (eData || []).map(e => ({
      id: e.id, alunoId: e.aluno_id, livroId: e.livro_id, 
      data: e.data_emprestimo, devolvido: e.devolvido, dataDev: e.data_devolucao
    }));

    const { data: avData, error: avErr } = await db.from('avaliacoes').select('*');
    if (!avErr) avaliacoes = (avData || []).map(a => ({
      id: a.id, alunoId: a.aluno_id, livroId: a.livro_id, 
      nota: a.nota, comentario: a.comentario, data: a.data_avaliacao
    }));

    renderApp();
  }

  /* ============ MATRÍCULA E SENHA ============ */
  function proximaMatricula() {
    const ano = new Date().getFullYear();
    const regex = new RegExp('^' + ano + '-(\\d{3})$');
    let maior = 0;
    alunos.forEach(a => {
      if (a.matricula) {
        const m = a.matricula.match(regex);
        if (m) maior = Math.max(maior, parseInt(m[1], 10));
      }
    });
    return `${ano}-${String(maior + 1).padStart(3, '0')}`;
  }

  const SENHA_KEY = 'bib_senha_bibliotecario';
  const SENHA_TENTATIVAS_KEY = 'bib_senha_tentativas';

  async function hashSenha(s) {
    const buf = new TextEncoder().encode(s);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  function temSenhaSalva() { return !!localStorage.getItem(SENHA_KEY); }
  function registrarTentativaErrada() {
    const t = JSON.parse(localStorage.getItem(SENHA_TENTATIVAS_KEY) || '{"n":0,"bloqueadoAte":0}');
    t.n = (t.n || 0) + 1;
    if (t.n >= 5) { t.bloqueadoAte = Date.now() + 60 * 1000; t.n = 0; }
    localStorage.setItem(SENHA_TENTATIVAS_KEY, JSON.stringify(t));
  }
  function limparTentativas() { localStorage.setItem(SENHA_TENTATIVAS_KEY, JSON.stringify({n:0,bloqueadoAte:0})); }
  function estaBloqueado() {
    const t = JSON.parse(localStorage.getItem(SENHA_TENTATIVAS_KEY) || '{"n":0,"bloqueadoAte":0}');
    return t.bloqueadoAte && t.bloqueadoAte > Date.now() ? Math.ceil((t.bloqueadoAte - Date.now()) / 1000) : 0;
  }

  function abrirSenhaBibliotecario() {
    const box = document.getElementById('senhaBox');
    const label = document.getElementById('senhaLabel');
    const btnEsqueci = document.getElementById('btnEsqueci');
    const btnEntrar = document.getElementById('btnSenhaEntrar');
    const perfilGrid = document.getElementById('perfilGrid');
    const erro = document.getElementById('senhaErro');
    const alunoBox = document.getElementById('loginAlunoBox');
    const btnAluno = document.getElementById('btnEntrarAluno');

    perfilGrid.style.display = 'none';
    alunoBox.classList.remove('ativo');
    btnAluno.style.display = 'none';
    
    box.classList.add('ativo');
    erro.style.display = 'none';

    if (temSenhaSalva()) {
      label.textContent = 'Senha do bibliotecário';
      btnEsqueci.style.display = 'inline-block';
      btnEntrar.textContent = 'Entrar';
    } else {
      label.textContent = 'Crie uma senha (mín. 4 caracteres)';
      btnEsqueci.style.display = 'none';
      btnEntrar.textContent = 'Criar senha e entrar';
    }
    document.getElementById('senhaInput').value = '';
    setTimeout(() => document.getElementById('senhaInput').focus(), 100);
  }

  async function confirmarSenhaBibliotecario() {
    const input = document.getElementById('senhaInput');
    const senha = input.value;
    if (senha.length < 4) return mostrarErroSenha('A senha precisa ter pelo menos 4 caracteres.');
    const bloqueio = estaBloqueado();
    if (bloqueio > 0) return mostrarErroSenha(`Aguarde ${bloqueio}s.`);

    if (!temSenhaSalva()) {
      const hash = await hashSenha(senha);
      localStorage.setItem(SENHA_KEY, hash);
      limparTentativas();
      entrarComoBibliotecario();
      return;
    }
    const hash = await hashSenha(senha);
    if (hash === localStorage.getItem(SENHA_KEY)) {
      limparTentativas();
      entrarComoBibliotecario();
    } else {
      registrarTentativaErrada();
      mostrarErroSenha('Senha incorreta.');
      input.value = '';
      input.focus();
    }
  }
  function mostrarErroSenha(msg) {
    const erro = document.getElementById('senhaErro');
    erro.textContent = msg; erro.style.display = 'block';
  }
  function resetarSenhaBibliotecario() {
    if (!confirm('Apagar a senha atual? Você poderá criar uma nova.')) return;
    localStorage.removeItem(SENHA_KEY);
    localStorage.removeItem(SENHA_TENTATIVAS_KEY);
    abrirSenhaBibliotecario();
  }
  function voltarLogin() {
    document.getElementById('senhaBox').classList.remove('ativo');
    document.getElementById('loginAlunoBox').classList.remove('ativo');
    document.getElementById('perfilGrid').style.display = 'grid';
    document.getElementById('senhaErro').style.display = 'none';
    document.getElementById('loginErro').style.display = 'none';
    document.getElementById('btnEntrarAluno').style.display = 'none';
  }

  function abrirTrocarSenha() {
    document.getElementById('senhaAtualInput').value = '';
    document.getElementById('senhaNovaInput').value = '';
    document.getElementById('senhaConfInput').value = '';
    document.getElementById('trocarSenhaErro').style.display = 'none';
    document.getElementById('modalTrocarSenha').classList.add('ativo');
  }
  function fecharTrocarSenha() { document.getElementById('modalTrocarSenha').classList.remove('ativo'); }
  async function salvarNovaSenha() {
    const atual = document.getElementById('senhaAtualInput').value;
    const nova = document.getElementById('senhaNovaInput').value;
    const conf = document.getElementById('senhaConfInput').value;
    const erro = document.getElementById('trocarSenhaErro');
    erro.style.display = 'none';

    if (!temSenhaSalva()) { erro.textContent = 'Não há senha cadastrada.'; erro.style.display = 'block'; return; }
    const hashAtual = await hashSenha(atual);
    if (hashAtual !== localStorage.getItem(SENHA_KEY)) { erro.textContent = 'Senha atual incorreta.'; erro.style.display = 'block'; return; }
    if (nova.length < 4) { erro.textContent = 'A nova senha precisa ter pelo menos 4 caracteres.'; erro.style.display = 'block'; return; }
    if (nova !== conf) { erro.textContent = 'As senhas não coincidem.'; erro.style.display = 'block'; return; }
    
    localStorage.setItem(SENHA_KEY, await hashSenha(nova));
    limparTentativas();
    fecharTrocarSenha();
    alert('✅ Senha atualizada com sucesso!');
  }

  /* ============ LOGIN ============ */
  function escolherPerfil(tipo) {
    if (tipo === 'bibliotecario') return abrirSenhaBibliotecario();
    
    const perfilGrid = document.getElementById('perfilGrid');
    const alunoBox = document.getElementById('loginAlunoBox');
    const btnAluno = document.getElementById('btnEntrarAluno');
    const senhaBox = document.getElementById('senhaBox');

    perfilGrid.style.display = 'none';
    senhaBox.classList.remove('ativo');
    alunoBox.classList.add('ativo');
    btnAluno.style.display = 'block';
    
    document.getElementById('loginNome').value = '';
    document.getElementById('loginTurma').value = '';
    document.getElementById('loginErro').style.display = 'none';
    setTimeout(() => document.getElementById('loginNome').focus(), 100);
  }

  function entrarComoAluno() {
    const nomeDigitado = document.getElementById('loginNome').value.trim();
    const turmaDigitada = document.getElementById('loginTurma').value.trim();
    const erro = document.getElementById('loginErro');
    erro.style.display = 'none';

    if (!nomeDigitado || !turmaDigitada) {
      erro.textContent = 'Preencha o nome e a turma.';
      erro.style.display = 'block';
      return;
    }

    const alunoEncontrado = alunos.find(a => 
      norm(a.nome) === norm(nomeDigitado) && norm(a.turma) === norm(turmaDigitada)
    );

    if (!alunoEncontrado) {
      erro.textContent = 'Aluno não encontrado. Verifique o nome e a turma.';
      erro.style.display = 'block';
      return;
    }

    sessao = { tipo: 'aluno', alunoId: alunoEncontrado.id, pagina: 'minhaFicha' };
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').classList.add('active');
    renderApp();
  }

  function entrarComoBibliotecario() {
    sessao = { tipo: 'bibliotecario', alunoId: null, pagina: 'painel' };
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').classList.add('active');
    renderApp();
  }

  function sair() {
    sessao = { tipo: null, alunoId: null, pagina: 'painel' };
    importState = { alunos: null, livros: null };
    document.getElementById('app').classList.remove('active');
    document.getElementById('loginScreen').style.display = 'flex';
    voltarLogin();
    fecharTrocarSenha();
    fecharModalLivro();
  }

  /* ============ MENUS ============ */
  const MENUS = {
    bibliotecario: [
      { id: 'painel',       s: 'i',   label: 'Painel' },
      { id: 'solicitacoes', s: 'ii',  label: 'Solicitações' },
      { id: 'alunos',       s: 'iii', label: 'Alunos' },
      { id: 'livros',       s: 'iv',  label: 'Acervo' },
      { id: 'emprestimos',  s: 'v',   label: 'Empréstimos' },
      { id: 'fichas',       s: 'vi',  label: 'Fichas' },
      { id: 'blog',         s: 'vii', label: 'Blog' },
    ],
    aluno: [
      { id: 'minhaFicha',    s: 'i',   label: 'Minha ficha' },
      { id: 'acervo',        s: 'ii',  label: 'Acervo' },
      { id: 'minhasSolic',   s: 'iii', label: 'Minhas solicitações' },
    ]
  };

  function pendentesBibliotecario() { return solicitacoes.filter(s => s.status === 'pendente').length; }
  function avisosPendentesAluno(alunoId) { return avisosAlunos.filter(a => a.alunoId === alunoId && !a.lido).length; }

  function renderApp() {
    if (!sessao.tipo) return;
    document.getElementById('btnTrocarSenha').style.display = sessao.tipo === 'bibliotecario' ? 'block' : 'none';

    if (sessao.tipo === 'aluno') {
      const a = alunos.find(x => x.id === sessao.alunoId);
      document.getElementById('userAvatar').textContent = a ? iniciais(a.nome) : '?';
      document.getElementById('userNome').textContent = a ? a.nome : '—';
      document.getElementById('userPerfil').textContent = 'Aluno' + (a?.turma ? ' · '+a.turma : '');
    } else {
      document.getElementById('userAvatar').textContent = 'B';
      document.getElementById('userNome').textContent = 'Bibliotecário(a)';
      document.getElementById('userPerfil').textContent = 'Perfil administrativo';
    }

    const nav = document.getElementById('navMenu');
    const notifBib = pendentesBibliotecario();
    const notifAluno = sessao.tipo === 'aluno' ? avisosPendentesAluno(sessao.alunoId) : 0;

    nav.innerHTML = MENUS[sessao.tipo].map(m => {
      let badge = '';
      if (sessao.tipo === 'bibliotecario' && m.id === 'solicitacoes' && notifBib > 0) badge = `<span class="nav-badge">${notifBib}</span>`;
      if (sessao.tipo === 'aluno' && m.id === 'minhaFicha' && notifAluno > 0) badge = `<span class="nav-badge">${notifAluno}</span>`;
      return `<button class="nav-item ${sessao.pagina===m.id?'active':''}" onclick="irPara('${m.id}')">
        <span class="simbolo">${m.s}.</span> ${m.label} ${badge}
      </button>`;
    }).join('');

    const main = document.getElementById('mainContent');
    const r = RENDERERS[sessao.tipo]?.[sessao.pagina];
    main.innerHTML = r ? r() : '<p class="empty">Página não encontrada.</p>';

    if (sessao.pagina === 'alunos') {
      const inp = document.getElementById('fileAlunos');
      if (inp) inp.addEventListener('change', (e) => lerCSVAlunos(e));
    }
    if (sessao.pagina === 'livros') {
      const inp = document.getElementById('fileLivros');
      if (inp) inp.addEventListener('change', (e) => lerCSVLivros(e));
    }
  }

  function irPara(p) { sessao.pagina = p; renderApp(); }

  /* ============ AÇÕES SUPABASE ============ */
  async function cadastrarAluno() {
    const nome = document.getElementById('alunoNome').value.trim();
    const turma = document.getElementById('alunoTurma').value.trim();
    if (!nome || !turma) return alert('Preencha o nome e a turma.');
    const matricula = proximaMatricula();
    const { error } = await db.from('alunos').insert([{ nome, turma, matricula }]);
    if (error) return alert('Erro: ' + error.message);
    await carregarDados();
  }

  async function removerAluno(id) {
    if (emprestimos.some(e => e.alunoId === id && !e.devolvido)) return alert('Aluno tem empréstimos em aberto.');
    if (!confirm('Remover este aluno?')) return;
    const { error } = await db.from('alunos').delete().eq('id', id);
    if (error) alert('Erro: ' + error.message);
    else await carregarDados();
  }

  async function cadastrarLivro() {
    const isbn = (document.getElementById('livroIsbn')?.value || '').trim();
    const titulo = document.getElementById('livroTitulo').value.trim();
    const autor = document.getElementById('livroAutor').value.trim();
    const genero = document.getElementById('livroGenero').value.trim() || 'Geral';
    const qtd = parseInt(document.getElementById('livroQtd').value) || 1;
    if (!titulo) return alert('Informe o título.');
    if (isbn && livros.some(l => norm(l.isbn) === norm(isbn))) return alert('Já existe um livro com este ISBN.');
    if (!isbn && livros.some(l => norm(l.titulo) === norm(titulo) && norm(l.autor) === norm(autor))) return alert('Já existe um livro com este título e autor.');

    const { error } = await db.from('livros').insert([{ isbn, titulo, autor, genero, quantidade: qtd, emprestados: 0 }]);
    if (error) alert('Erro: ' + error.message);
    else await carregarDados();
  }

  async function removerLivro(id) {
    const l = livros.find(x => x.id === id);
    if (!l) return;
    if (l.emprestados > 0) return alert('Há exemplares emprestados.');
    if (!confirm('Remover este livro?')) return;
    const { error } = await db.from('livros').delete().eq('id', id);

    const alunoId = document.getElementById('empAluno').value;
    const livroId = document.getElementById('empLivro').value;
    const data = document.getElementById('empData').value || hoje();
    if (!alunoId || !livroId) return alert('Selecione aluno e livro.');
    
    const l = livros.find(x => x.id === livroId);
    if (l.emprestados >= l.quantidade) return alert('Sem exemplares.');

    await db.from('livros').update({ emprestados: l.emprestados + 1 }).eq('id', livroId);
    await db.from('emprestimos').insert([{ aluno_id: alunoId, livro_id: livroId, data_emprestimo: data, devolvido: false }]);
    await carregarDados();
  }

    const e = emprestimos.find(x => x.id === empId);
    if (!e || e.devolvido) return;
    const l = livros.find(x => x.id === e.livroId);
    
    await db.from('livros').update({ emprestados: Math.max(0, l.emprestados - 1) }).eq('id', l.id);
    await db.from('emprestimos').update({ devolvido: true, data_devolucao: hoje() }).eq('id', empId);
    await carregarDados();

  /* ============ CSV E IMPORTAÇÃO ============ */
  function parseCSV(texto) {
    if (texto.charCodeAt(0) === 0xFEFF) texto = texto.slice(1);
    const linhas = []; let atual = []; let campo = ''; let dentroAspas = false;
    for (let i = 0; i < texto.length; i++) {
      const c = texto[i]; const prox = texto[i + 1];
      if (c === '"') { if (dentroAspas && prox === '"') { campo += '"'; i++; } else { dentroAspas = !dentroAspas; } }
      else if (c === ',' && !dentroAspas) { atual.push(campo); campo = ''; }
      else if ((c === '\n' || c === '\r') && !dentroAspas) {
        if (c === '\r' && prox === '\n') i++;
        atual.push(campo);
        if (atual.some(x => x.trim() !== '')) linhas.push(atual);
        atual = []; campo = '';
      } else { campo += c; }
    }
    if (campo !== '' || atual.length) { atual.push(campo); if (atual.some(x => x.trim() !== '')) linhas.push(atual); }
    return linhas;
  }
  function encontrarColuna(cabecalho, nomesAceitos) {
    for (let i = 0; i < cabecalho.length; i++) {
      const h = norm(cabecalho[i]).replace(/[áàâã]/g,'a').replace(/[éê]/g,'e').replace(/[íî]/g,'i').replace(/[óô]/g,'o').replace(/[úû]/g,'u').replace(/ç/g,'c');
      for (const nome of nomesAceitos) if (h === nome) return i;
    }
    return -1;
  }

  function lerCSVAlunos(event) {
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const linhas = parseCSV(e.target.result);
        if (linhas.length < 2) { alert('Arquivo vazio.'); return; }
        const cab = linhas[0];
        const idxNome = encontrarColuna(cab, ['nome','nome completo','aluno']);
        const idxTurma = encontrarColuna(cab, ['turma','classe','serie','série']);
        if (idxNome === -1 || idxTurma === -1) { alert('Colunas "Nome" e "Turma" obrigatórias.'); return; }
        const vistos = new Set();
        const novasLinhas = [];
        for (let i = 1; i < linhas.length; i++) {
          const l = linhas[i];
          const nome = (l[idxNome] || '').trim(); if (!nome) continue;
          const turma = (l[idxTurma] || '').trim(); if (!turma) continue;
          const chave = norm(nome) + '||' + norm(turma);
          const dupPlanilha = vistos.has(chave);
          const dupBanco = alunos.some(a => norm(a.nome) === norm(nome) && norm(a.turma) === norm(turma));
          let status = 'ok', motivo = '';
          if (dupPlanilha) { status = 'dup'; motivo = 'Repetido'; }
          else if (dupBanco) { status = 'dup'; motivo = 'Já cadastrado'; }
          if (status === 'ok') vistos.add(chave);
          novasLinhas.push({ nome, turma, status, motivo });
        }
        importState.alunos = { linhas: novasLinhas, arquivo: file.name };
        renderApp();
      } catch (err) { alert('Erro: ' + err.message); }
    };
    reader.readAsText(file, 'UTF-8');
    event.target.value = '';
  }

  function lerCSVLivros(event) {
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const linhas = parseCSV(e.target.result);
        if (linhas.length < 2) { alert('Arquivo vazio.'); return; }
        const cab = linhas[0];
        const idxIsbn = encontrarColuna(cab, ['isbn','isbn13','codigo']);
        const idxTitulo = encontrarColuna(cab, ['titulo','título','title']);
        const idxAutor = encontrarColuna(cab, ['autor','author']);
        const idxGenero = encontrarColuna(cab, ['genero','gênero','genre']);
        const idxQtd = encontrarColuna(cab, ['quantidade','qtd','exemplares']);
        if (idxTitulo === -1) { alert('Coluna "Título" obrigatória.'); return; }
        const isbns = new Set(); const titulos = new Set();
        const novasLinhas = [];
        for (let i = 1; i < linhas.length; i++) {
          const l = linhas[i];
          const titulo = (l[idxTitulo] || '').trim(); if (!titulo) continue;
          const isbn = idxIsbn >= 0 ? (l[idxIsbn] || '').trim() : '';
          const autor = idxAutor >= 0 ? (l[idxAutor] || '').trim() : '';
          const genero = (idxGenero >= 0 ? (l[idxGenero] || '').trim() : '') || 'Geral';
          const qtd = Math.max(1, parseInt(idxQtd >= 0 ? l[idxQtd] : '') || 1);
          const chaveIsbn = norm(isbn); const chaveTA = norm(titulo) + '||' + norm(autor);
          let status = 'ok', motivo = '';
          if (isbn && isbns.has(chaveIsbn)) { status = 'dup'; motivo = 'ISBN repetido'; }
          else if (!isbn && titulos.has(chaveTA)) { status = 'dup'; motivo = 'Título repetido'; }
          else if (isbn && livros.some(x => norm(x.isbn) === chaveIsbn)) { status = 'dup'; motivo = 'ISBN já no acervo'; }
          else if (!isbn && livros.some(x => norm(x.titulo) === norm(titulo) && norm(x.autor) === norm(autor))) { status = 'dup'; motivo = 'Título já no acervo'; }
          if (status === 'ok') { if (isbn) isbns.add(chaveIsbn); else titulos.add(chaveTA); }
          novasLinhas.push({ isbn, titulo, autor, genero, qtd, status, motivo });
        }
        importState.livros = { linhas: novasLinhas, arquivo: file.name };
        renderApp();
      } catch (err) { alert('Erro: ' + err.message); }
    };
    reader.readAsText(file, 'UTF-8');
    event.target.value = '';
  }

      },
      alunos() {
        return `
          ${header('Alunos', 'Cadastro e gestão dos leitores', '')}
          <div class="card">
            <div class="import-bar">
              <button class="btn btn-primary" onclick="document.getElementById('fileAlunos').click()">📥 Importar CSV</button>
              <input type="file" id="fileAlunos" accept=".csv" style="display:none">
              <button class="btn btn-ghost" onclick="baixarModeloAlunos()">📄 Baixar modelo</button>
            </div>
            <div class="form-grid" style="grid-template-columns: 2fr 1fr auto;">
              <input id="alunoNome" placeholder="Nome completo">
              <input id="alunoTurma" placeholder="Turma">
              <button class="btn btn-primary" onclick="cadastrarAluno()">Cadastrar</button>
            </div>
          </div>
          ${renderPreviewAlunos()}
          <div class="card">
            <div class="card-header"><h2>Cadastrados</h2><span class="num">${alunos.length}</span></div>
            ${alunos.length ? `
              <table>
                <thead><tr><th>Matrícula</th><th>Nome</th><th>Turma</th><th></th></tr></thead>
                <tbody>
                ${alunos.map(a => `<tr>
                  <td><strong class="matricula-cell">${a.matricula || '—'}</strong></td>
                  <td>${a.nome}</td>
                  <td>${a.turma || '—'}</td>
                  <td><button class="btn btn-danger btn-sm" onclick="removerAluno('${a.id}')">Remover</button></td>
                </tr>`).join('')}
                </tbody>
              </table>` : '<p class="empty">Nenhum aluno cadastrado.</p>'}
          </div>`;
      },
      livros() {
        const grupos = {};
        livros.forEach(l => (grupos[l.genero] = grupos[l.genero] || []).push(l));
        const generos = Object.keys(grupos).sort();
        return `
          ${header('Acervo', 'Livros organizados por gênero', '')}
          <div class="card">
            <div class="import-bar">
              <button class="btn btn-primary" onclick="document.getElementById('fileLivros').click()">📥 Importar CSV</button>
              <input type="file" id="fileLivros" accept=".csv" style="display:none">
              <button class="btn btn-ghost" onclick="baixarModeloLivros()">📄 Baixar modelo</button>
            </div>
            <div class="form-grid">
              <input id="livroIsbn" placeholder="ISBN (opcional)">
              <input id="livroTitulo" placeholder="Título">
              <input id="livroAutor" placeholder="Autor">
              <input id="livroGenero" placeholder="Gênero">
              <input id="livroQtd" type="number" min="1" value="1" placeholder="Exemplares">
              <button class="btn btn-primary" onclick="cadastrarLivro()">Cadastrar</button>
            </div>
          </div>
          ${renderPreviewLivros()}
          <div class="card">
            <div class="card-header"><h2>Livros</h2><span class="num">${livros.length}</span></div>
            ${livros.length ? `
              <div class="livros-grid">
                ${generos.map(g => `
                  <div class="genero-titulo">${g} <em>${grupos[g].length} títulos</em></div>
                  ${grupos[g].map(l => {
                    const disp = l.quantidade - l.emprestados;
                    return `<div class="livro-card">
                      <div class="livro-genero">${l.genero}</div>
                      <h3>${l.titulo}</h3>
                      <div class="autor">${l.autor || 'Autor não informado'}</div>
                      <div class="estoque">
                        <span class="badge ${disp>0?'badge-green':'badge-red'}">${disp>0?'Disponível':'Esgotado'}</span><br>
                        <span style="font-size:.78rem;color:var(--tinta-clara);">${disp} de ${l.quantidade} exemplares</span>
                      </div>
                      <div style="margin-top:12px;">
                        <button class="btn btn-danger btn-sm" onclick="removerLivro('${l.id}')">Remover</button>
                      </div>
                    </div>`;
                  }).join('')}
                `).join('')}
              </div>` : '<p class="empty">Nenhum livro cadastrado.</p>'}
          </div>`;
      },
      emprestimos() {
        const ativos = emprestimos.filter(e => !e.devolvido);
        const optsAlunos = alunos.map(a => `<option value="${a.id}">${a.nome}</option>`).join('');
        const optsLivros = livros.filter(l => l.emprestados < l.quantidade).map(l => `<option value="${l.id}">${l.titulo}</option>`).join('');
        return `
          ${header('Empréstimos', 'Registre e gerencie as saídas', '')}
          <div class="card">
            <div class="card-header"><h2>Novo empréstimo</h2></div>
            ${alunos.length && livros.length ? `
              <div class="form-grid" style="grid-template-columns: 1fr 1fr 1fr auto;">
                <select id="empAluno"><option value="">Aluno...</option>${optsAlunos}</select>
                <select id="empLivro"><option value="">Livro...</option>${optsLivros || '<option>Nenhum disponível</option>'}</select>
                <input id="empData" type="date" value="${hoje()}">
                <button class="btn btn-primary" onclick="emprestar()">Emprestar</button>
              </div>
            ` : '<p class="empty">Cadastre alunos e livros primeiro.</p>'}
          </div>
          <div class="card">
            <div class="card-header"><h2>Ativos</h2><span class="num">${ativos.length}</span></div>
            ${ativos.length ? `
              <table>
                <thead><tr><th>Aluno</th><th>Livro</th><th>Data</th><th></th></tr></thead>
                <tbody>
                ${ativos.map(e => `<tr>
                  <td><strong>${nomeAluno(e.alunoId)}</strong></td>
                  <td>${nomeLivro(e.livroId)}</td>
                  <td>${fmtData(e.data)}</td>
                  <td><button class="btn btn-ghost btn-sm" onclick="devolver('${e.id}')">Devolver</button></td>
                </tr>`).join('')}
                </tbody>
              </table>` : '<p class="empty">Nenhum empréstimo ativo.</p>'}
          </div>`;
      },
      fichas() {
        const opts = alunos.map(a => `<option value="${a.id}">${a.nome} — ${a.turma}</option>`).join('');
        return `
          ${header('Fichas', 'Consulte a ficha de cada leitor', '')}
          <div class="card">
            <select id="fichaAluno" onchange="atualizarFicha()" style="max-width:360px">
              <option value="">Selecione um aluno...</option>${opts}
            </select>
          </div>
          <div id="fichaConteudo"><p class="empty">Selecione um aluno para ver a ficha.</p></div>`;
      },
      blog() {
        if (!avaliacoes.length) return header('Blog', 'Mural de resenhas', '') + `<div class="card"><p class="empty">Nenhuma avaliação ainda.</p></div>`;
        const grupos = {};
        avaliacoes.forEach(a => (grupos[a.livroId] = grupos[a.livroId] || []).push(a));
        
        return header('Blog', 'Mural de resenhas', '') + Object.keys(grupos).map(lid => {
          const lista = grupos[lid];
          const media = (lista.reduce((s,a)=>s+a.nota,0)/lista.length).toFixed(1);
          return `
            <div class="card">
              <div class="card-header">
                <h2>${nomeLivro(lid)}</h2>
                <span class="num">${estrelas(Math.round(media))} ${media}</span>
              </div>
              ${lista.map(a => `
                <div class="avaliacao-item" style="display:flex; justify-content:space-between; align-items:start;">
                  <div>
                    <strong>${nomeAluno(a.alunoId)}</strong>
                    <div class="stars">${estrelas(a.nota)}</div>
                    <p>"${a.comentario || 'Sem comentário'}"</p>
                  </div>
                  <button class="btn btn-danger btn-sm" onclick="excluirAvaliacao('${a.id}')" title="Excluir esta avaliação">🗑️ Excluir</button>
                </div>`).join('')}
            </div>`;
        }).join('');
      }
    },
    aluno: {
      minhaFicha() {
        const a = alunos.find(x => x.id === sessao.alunoId);
        if (!a) return '<p class="empty">Aluno não encontrado.</p>';
        
        const meusAvisos = avisosAlunos.filter(av => av.alunoId === sessao.alunoId && !av.lido);
        const htmlAvisos = meusAvisos.length ? meusAvisos.map(av => `
          <div class="aviso-card">
            <h4>📢 Livro Liberado!</h4>
            <p>O livro <strong>${av.livroTitulo}</strong> foi aprovado. Você já pode ir à biblioteca buscá-lo!</p>
            <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="marcarAvisoLido('${av.id}')">Entendi, vou buscar</button>
          </div>
        `).join('') : '';

        return `
          ${header('Minha ficha', 'Seu registro como leitor', '')}
          
          ${htmlAvisos}

          <div class="ficha-header">
            <div class="avatar-grande">${iniciais(a.nome)}</div>
            <div>
              <h2>${a.nome}</h2>
              <p>${a.turma ? a.turma : 'Turma não informada'} ${a.matricula ? `<span class="matricula-tag">${a.matricula}</span>` : ''}</p>
            </div>
          </div>
          ${renderFichaAluno(a.id)}`;
      },
      acervo() {
        const grupos = {};
        livros.forEach(l => (grupos[l.genero] = grupos[l.genero] || []).push(l));
        const generos = Object.keys(grupos).sort();
        return `
          ${header('Acervo', 'Explore os livros e veja as resenhas', '')}
          <div class="card">
            ${livros.length ? `
              <div class="livros-grid">
                ${generos.map(g => `
                  <div class="genero-titulo">${g} <em>${grupos[g].length} títulos</em></div>
                  ${grupos[g].map(l => {
                    const disp = l.quantidade - l.emprestados;
                    const aval = avaliacoes.filter(a => a.livroId === l.id);
                    const media = aval.length ? (aval.reduce((s,a)=>s+a.nota,0)/aval.length).toFixed(1) : null;
                    return `<div class="livro-card" onclick="abrirModalLivro('${l.id}')">
                      <div class="livro-genero">${l.genero}</div>
                      <h3>${l.titulo}</h3>
                      <div class="autor">${l.autor || 'Autor não informado'}</div>
                      <div class="estoque">
                        <span class="badge ${disp>0?'badge-green':'badge-red'}">${disp>0?'Disponível':'Esgotado'}</span><br>
                        <span style="font-size:.78rem;color:var(--tinta-clara);">${disp} de ${l.quantidade} exemplares</span>
                        ${media ? `<div class="stars" style="margin-top:8px;">${estrelas(Math.round(media))} <span style="color:var(--tinta-clara);font-size:.8rem;">${media}</span></div>` : ''}
                      </div>
                    </div>`;
                  }).join('')}
                `).join('')}
              </div>` : '<p class="empty">Nenhum livro no acervo ainda.</p>'}
          </div>`;
      },
      minhasSolic() {
        const minhas = solicitacoes.filter(s => s.alunoId === sessao.alunoId);
        const pend = minhas.filter(s => s.status === 'pendente');
        return `
          ${header('Minhas solicitações', 'Acompanhe seus pedidos', '')}
          <div class="card">
            <div class="card-header"><h2>Pendentes</h2><span class="num">${pend.length}</span></div>
            ${pend.length ? pend.map(s => `
              <div class="solicitacao-card pendente">
                <div class="topo"><h3>${nomeLivro(s.livroId)}</h3></div>
                <div class="meta">Aguardando aprovação</div>
              </div>`).join('') : '<p class="empty">Nenhuma solicitação pendente.</p>'}
          </div>`;
      }
    }
  };

  function renderFichaAluno(alunoId) {
    const hist = emprestimos.filter(e => e.alunoId === alunoId);
    const pend = hist.filter(e => !e.devolvido);
    const avals = avaliacoes.filter(a => a.alunoId === alunoId);
    return `
      <div class="card">
        <div class="card-header"><h2>Livros não entregues</h2><span class="num">${pend.length}</span></div>
        ${pend.length ? `
          <table>
            <thead><tr><th>Livro</th><th>Data</th></tr></thead>
            <tbody>${pend.map(e => `<tr><td><strong>${nomeLivro(e.livroId)}</strong></td><td>${fmtData(e.data)}</td></tr>`).join('')}</tbody>
          </table>` : '<p class="empty">Nenhum livro pendente.</p>'}
      </div>
      <div class="card">
        <div class="card-header"><h2>Histórico de leitura</h2><span class="num">${hist.length}</span></div>
        ${hist.length ? `
          <table>
            <thead><tr><th>Livro</th><th>Data</th><th>Status</th></tr></thead>
            <tbody>${hist.map(e => `<tr><td><strong>${nomeLivro(e.livroId)}</strong></td><td>${fmtData(e.data)}</td><td>${e.devolvido ? 'Devolvido' : 'Pendente'}</td></tr>`).join('')}</tbody>
          </table>` : '<p class="empty">Sem histórico.</p>'}
      </div>
      <div class="card">
        <div class="card-header"><h2>Avaliações feitas</h2><span class="num">${avals.length}</span></div>
        ${avals.length ? avals.map(a => `<div class="avaliacao-item"><strong>${nomeLivro(a.livroId)}</strong><div class="stars">${estrelas(a.nota)}</div><p>${a.comentario}</p></div>`).join('') : '<p class="empty">Nenhuma avaliação.</p>'}
      </div>`;
  }

  function atualizarFicha() {
    const id = document.getElementById('fichaAluno').value;
    const box = document.getElementById('fichaConteudo');
    if (!id) { box.innerHTML = '<p class="empty">Selecione um aluno.</p>'; return; }
    const a = alunos.find(x => x.id === id);
    if (!a) return;
    box.innerHTML = `
      <div class="ficha-header">
        <div class="avatar-grande">${iniciais(a.nome)}</div>
        <div><h2>${a.nome}</h2><p>${a.turma}</p></div>
      </div>
      ${renderFichaAluno(id)}`;
  }

  // Inicializa o app
  window.onload = () => {
    carregarDados();
  };
</script>
</body>
</html>
