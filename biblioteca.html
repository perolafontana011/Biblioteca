<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca · Colégio Estadual Unidade Polo</title>
<style>
  :root {
    --papel: #f6f1e8;
    --papel-escuro: #ede6d6;
    --papel-borda: #ddd3bf;
    --tinta: #1c1712;
    --tinta-suave: #4a3f33;
    --tinta-clara: #877b69;
    --musgo: #3d5a3d;
    --musgo-escuro: #2a3f2a;
    --terracota: #a8563c;
    --dourado: #b89155;
    --dourado-escuro: #8f6f3e;
    --creme-card: #fcf8ef;
    --borda-fina: #d4c9b2;
    --sombra: 0 1px 3px rgba(28,23,18,.06), 0 4px 16px rgba(28,23,18,.04);
    --sombra-forte: 0 4px 28px rgba(28,23,18,.12);
    --serif: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, 'Times New Roman', serif;
    --sans: 'Optima', 'Segoe UI', -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--papel);
    color: var(--tinta);
    font-size: 15px;
    line-height: 1.6;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(184,145,85,.05) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(61,90,61,.04) 0%, transparent 40%);
    background-attachment: fixed;
  }

  /* ================= LOGIN ================= */
  .login-screen {
    position: fixed; inset: 0;
    background: var(--papel);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; z-index: 1000;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(184,145,85,.05) 40px);
  }
  .login-box {
    background: var(--creme-card);
    max-width: 500px; width: 100%;
    padding: 60px 52px 46px;
    border: 1px solid var(--borda-fina);
    box-shadow: var(--sombra-forte);
    position: relative;
    text-align: center;
  }
  .login-box::before {
    content: '';
    position: absolute; inset: 8px;
    border: 1px solid var(--borda-fina);
    pointer-events: none;
  }
  .login-box::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--dourado), var(--musgo), var(--dourado));
  }
  .login-brasao {
    width: 74px; height: 74px;
    margin: 0 auto 22px;
    border-radius: 50%;
    background: var(--papel-escuro);
    border: 2px solid var(--dourado);
    display: grid; place-items: center;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.4rem;
    color: var(--musgo);
    letter-spacing: .02em;
    position: relative;
    box-shadow: inset 0 0 0 4px var(--creme-card);
  }
  .login-exlibris {
    font-family: var(--sans);
    font-size: .68rem;
    letter-spacing: .4em;
    text-transform: uppercase;
    color: var(--dourado-escuro);
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--borda-fina);
  }
  .login-marca {
    font-family: var(--serif);
    font-size: 1.55rem;
    line-height: 1.3;
    font-weight: 400;
    color: var(--tinta);
    letter-spacing: -.005em;
    margin-bottom: 10px;
  }
  .login-marca em {
    font-style: italic;
    color: var(--musgo);
    display: block;
    font-size: 1.9rem;
    margin-top: 4px;
  }
  .login-sub {
    font-family: var(--serif);
    font-style: italic;
    color: var(--tinta-clara);
    font-size: .92rem;
    margin-bottom: 34px;
  }
  .ornamento {
    display: flex; align-items: center; gap: 12px;
    margin: 30px 0;
    color: var(--dourado);
    font-size: .72rem;
    letter-spacing: .35em;
  }
  .ornamento::before, .ornamento::after {
    content: ''; flex: 1; height: 1px;
    background: var(--borda-fina);
  }
  .perfil-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin-bottom: 20px;
  }
  .perfil-card {
    padding: 26px 16px;
    background: var(--papel);
    border: 1px solid var(--borda-fina);
    cursor: pointer;
    transition: all .25s ease;
    text-align: center;
    font-family: inherit;
    position: relative;
  }
  .perfil-card:hover {
    background: var(--creme-card);
    border-color: var(--musgo);
    transform: translateY(-3px);
    box-shadow: var(--sombra);
  }
  .perfil-card:hover::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: var(--dourado);
  }
  .perfil-card .simbolo {
    font-family: var(--serif);
    font-size: 1.8rem;
    color: var(--musgo);
    display: block;
    margin-bottom: 10px;
    font-style: italic;
  }
  .perfil-card h3 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 1.05rem;
    color: var(--tinta);
    margin-bottom: 4px;
  }
  .perfil-card small {
    color: var(--tinta-clara);
    font-size: .76rem;
    font-family: var(--sans);
  }

  .login-aluno-select {
    width: 100%; padding: 14px;
    background: var(--papel);
    border: 1px solid var(--borda-fina);
    font-family: var(--sans);
    font-size: .95rem;
    color: var(--tinta);
    margin-bottom: 12px;
    display: none;
  }
  .login-aluno-select:focus { outline: none; border-color: var(--musgo); }
  .btn-entrar {
    width: 100%; padding: 14px;
    background: var(--musgo);
    color: var(--creme-card);
    border: none;
    font-family: var(--serif);
    font-size: 1rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: .2s;
    display: none;
  }
  .btn-entrar:hover { background: var(--musgo-escuro); }

  .senha-box { display: none; animation: fadeIn .25s; }
  .senha-box.ativo { display: block; }
  .senha-label {
    font-family: var(--serif);
    font-style: italic;
    font-size: .88rem;
    color: var(--tinta-clara);
    text-align: left;
    margin-bottom: 6px;
    display: block;
  }
  .senha-input {
    width: 100%;
    padding: 14px;
    background: var(--papel);
    border: 1px solid var(--borda-fina);
    font-family: var(--sans);
    font-size: .95rem;
    color: var(--tinta);
    margin-bottom: 12px;
    letter-spacing: .15em;
  }
  .senha-input:focus { outline: none; border-color: var(--musgo); }
  .senha-erro {
    background: #f8e5df;
    border: 1px solid var(--terracota);
    color: var(--terracota);
    font-family: var(--serif);
    font-style: italic;
    font-size: .85rem;
    padding: 10px 14px;
    margin-bottom: 12px;
    text-align: left;
  }
  .btn-esqueci {
    background: transparent;
    border: none;
    color: var(--tinta-clara);
    font-family: var(--serif);
    font-style: italic;
    font-size: .82rem;
    cursor: pointer;
    text-decoration: underline;
    margin-top: 10px;
    padding: 4px;
    display: none;
  }
  .btn-esqueci:hover { color: var(--musgo); }
  .btn-voltar-login {
    background: transparent;
    border: none;
    color: var(--tinta-clara);
    font-family: var(--serif);
    font-size: .82rem;
    cursor: pointer;
    margin-top: 10px;
    padding: 4px;
  }
  .btn-voltar-login:hover { color: var(--terracota); }

  /* ================= APP ================= */
  .app { display: none; min-height: 100vh; }
  .app.active { display: flex; }

  .sidebar {
    width: 270px;
    background: var(--papel-escuro);
    border-right: 1px solid var(--borda-fina);
    padding: 32px 22px;
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
    overflow-y: auto;
  }
  .marca {
    padding-bottom: 22px;
    border-bottom: 1px solid var(--borda-fina);
    margin-bottom: 24px;
  }
  .marca h1 {
    font-family: var(--serif);
    font-size: 1.1rem;
    font-weight: 400;
    color: var(--tinta);
    line-height: 1.35;
    letter-spacing: -.005em;
  }
  .marca h1 em {
    font-style: italic;
    color: var(--musgo);
    font-size: 1.15rem;
  }
  .marca small {
    font-size: .65rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--dourado-escuro);
    display: block;
    margin-top: 10px;
    font-family: var(--sans);
  }
  .user-badge {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0 20px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--borda-fina);
  }
  .user-badge .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--musgo);
    color: var(--creme-card);
    display: grid; place-items: center;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.1rem;
    flex-shrink: 0;
    border: 1.5px solid var(--dourado);
  }
  .user-badge strong {
    display: block;
    font-family: var(--serif);
    font-weight: 400;
    font-size: .95rem;
    color: var(--tinta);
    line-height: 1.2;
  }
  .user-badge small {
    font-size: .7rem;
    color: var(--tinta-clara);
    display: block;
    margin-top: 2px;
    font-family: var(--sans);
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 4px;
    border: none; background: transparent;
    font-family: var(--sans);
    font-size: .9rem;
    color: var(--tinta-suave);
    cursor: pointer;
    text-align: left;
    width: 100%;
    border-bottom: 1px solid transparent;
    transition: .15s;
    position: relative;
  }
  .nav-item:hover { color: var(--musgo); padding-left: 8px; }
  .nav-item.active {
    color: var(--musgo);
    border-bottom-color: var(--musgo);
    font-weight: 600;
  }
  .nav-item .simbolo {
    font-family: var(--serif);
    font-style: italic;
    width: 18px;
    color: var(--tinta-clara);
    font-size: 1rem;
  }
  .nav-item.active .simbolo { color: var(--musgo); }
  .nav-badge {
    margin-left: auto;
    background: var(--terracota);
    color: var(--creme-card);
    font-family: var(--sans);
    font-size: .68rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: .04em;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  .sidebar-footer {
    margin-top: auto;
    padding-top: 20px;
    border-top: 1px solid var(--borda-fina);
    display: flex; flex-direction: column; gap: 8px;
  }
  .btn-sair, .btn-trocar-senha {
    padding: 10px;
    background: transparent;
    color: var(--tinta-clara);
    border: 1px solid var(--borda-fina);
    font-family: var(--sans);
    font-size: .76rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: .2s;
  }
  .btn-sair:hover { color: var(--terracota); border-color: var(--terracota); }
  .btn-trocar-senha:hover { color: var(--musgo); border-color: var(--musgo); }

  .main {
    flex: 1;
    padding: 44px 56px;
    max-width: 1120px;
    overflow-x: hidden;
  }
  .escola-tag {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--sans);
    font-size: .65rem;
    letter-spacing: .35em;
    text-transform: uppercase;
    color: var(--dourado-escuro);
    margin-bottom: 14px;
  }
  .escola-tag::before {
    content: '';
    width: 24px; height: 1px;
    background: var(--dourado);
  }
  .page-header {
    margin-bottom: 38px;
    padding-bottom: 22px;
    border-bottom: 1px solid var(--borda-fina);
    display: flex; align-items: flex-end; gap: 20px;
  }
  .page-title {
    font-family: var(--serif);
    font-size: 2.1rem;
    font-weight: 400;
    letter-spacing: -.015em;
    color: var(--tinta);
    line-height: 1.15;
  }
  .page-title em { font-style: italic; color: var(--musgo); }
  .page-sub {
    font-family: var(--serif);
    font-style: italic;
    color: var(--tinta-clara);
    font-size: .95rem;
    margin-top: 8px;
  }
  .sino {
    margin-left: auto;
    position: relative;
    font-family: var(--serif);
    font-size: 1.4rem;
    color: var(--tinta-suave);
    cursor: pointer;
    padding: 6px 10px;
    border: 1px solid var(--borda-fina);
    background: var(--creme-card);
    transition: .2s;
  }
  .sino:hover { color: var(--musgo); border-color: var(--musgo); }
  .sino .contador {
    position: absolute;
    top: -8px; right: -8px;
    background: var(--terracota);
    color: var(--creme-card);
    font-family: var(--sans);
    font-size: .68rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    min-width: 20px;
    text-align: center;
    animation: pulse 2s infinite;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    margin-bottom: 36px;
    border-top: 1px solid var(--borda-fina);
    border-bottom: 1px solid var(--borda-fina);
  }
  .stat-card {
    padding: 24px 20px;
    border-right: 1px solid var(--borda-fina);
    text-align: left;
  }
  .stat-card:last-child { border-right: none; }
  .stat-card .label {
    font-size: .68rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--tinta-clara);
    font-weight: 600;
    margin-bottom: 10px;
    font-family: var(--sans);
  }
  .stat-card .valor {
    font-family: var(--serif);
    font-size: 2.2rem;
    font-weight: 400;
    color: var(--tinta);
    line-height: 1;
  }
  .stat-card .valor em { font-style: italic; color: var(--musgo); }

  .card {
    background: var(--creme-card);
    border: 1px solid var(--borda-fina);
    padding: 28px;
    margin-bottom: 24px;
    box-shadow: var(--sombra);
  }
  .card-header {
    display: flex; align-items: baseline; gap: 12px;
    padding-bottom: 14px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--borda-fina);
  }
  .card-header h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 1.25rem;
    color: var(--tinta);
  }
  .card-header .num {
    font-family: var(--serif);
    font-style: italic;
    color: var(--dourado);
    font-size: 1rem;
    margin-left: auto;
  }

  .form-grid {
    display: grid;
    gap: 10px;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  }
  input, select, textarea {
    width: 100%;
    padding: 11px 13px;
    background: var(--papel);
    border: 1px solid var(--borda-fina);
    font-family: var(--sans);
    font-size: .92rem;
    color: var(--tinta);
    transition: .15s;
    border-radius: 0;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--musgo);
    background: var(--creme-card);
  }
  input::placeholder, textarea::placeholder { color: var(--tinta-clara); }
  input[readonly] { background: var(--papel-escuro); cursor: not-allowed; }
  textarea { resize: vertical; min-height: 80px; }

  .btn {
    padding: 11px 20px;
    border: 1px solid transparent;
    font-family: var(--sans);
    font-size: .78rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
    border-radius: 0;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--musgo);
    color: var(--creme-card);
    border-color: var(--musgo);
  }
  .btn-primary:hover { background: var(--musgo-escuro); border-color: var(--musgo-escuro); }
  .btn-primary:disabled {
    background: var(--papel-escuro);
    color: var(--tinta-clara);
    border-color: var(--borda-fina);
    cursor: not-allowed;
  }
  .btn-danger {
    background: transparent;
    color: var(--terracota);
    border-color: var(--borda-fina);
  }
  .btn-danger:hover { border-color: var(--terracota); }
  .btn-ghost {
    background: transparent;
    color: var(--musgo);
    border-color: var(--borda-fina);
  }
  .btn-ghost:hover { border-color: var(--musgo); background: var(--papel); }
  .btn-sm { padding: 6px 12px; font-size: .7rem; letter-spacing: .1em; }

  table { width: 100%; border-collapse: collapse; }
  th, td {
    padding: 14px 8px;
    text-align: left;
    border-bottom: 1px solid var(--borda-fina);
    font-size: .9rem;
  }
  th {
    font-family: var(--sans);
    font-size: .68rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--tinta-clara);
    font-weight: 600;
    padding-top: 0;
  }
  td { color: var(--tinta-suave); }
  td strong {
    font-family: var(--serif);
    font-weight: 400;
    color: var(--tinta);
    font-size: .98rem;
  }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: rgba(184,145,85,.05); }

  .matricula-cell {
    font-family: var(--serif);
    letter-spacing: .05em;
    color: var(--musgo);
    font-weight: 600;
  }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    font-family: var(--sans);
    font-size: .68rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    font-weight: 600;
    border: 1px solid currentColor;
  }
  .badge-green { color: var(--musgo); }
  .badge-red { color: var(--terracota); }
  .badge-blue { color: #4a6b8a; }
  .badge-yellow { color: #9c7b2a; }

  .livros-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
  }
  .livro-card {
    background: var(--papel);
    border: 1px solid var(--borda-fina);
    padding: 22px;
    transition: .25s;
    display: flex; flex-direction: column;
    position: relative;
  }
  .livro-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--dourado);
  }
  .livro-card:hover {
    background: var(--creme-card);
    box-shadow: var(--sombra);
    transform: translateY(-2px);
  }
  .livro-genero {
    font-family: var(--serif);
    font-style: italic;
    font-size: .82rem;
    color: var(--tinta-clara);
    margin-bottom: 6px;
  }
  .livro-card h3 {
    font-family: var(--serif);
    font-size: 1.15rem;
    font-weight: 400;
    line-height: 1.25;
    color: var(--tinta);
    margin-bottom: 4px;
  }
  .livro-card .autor {
    font-size: .85rem;
    color: var(--tinta-suave);
    margin-bottom: 14px;
    font-style: italic;
  }
  .livro-card .estoque {
    font-size: .82rem;
    color: var(--tinta-suave);
    padding: 10px 0;
    margin-top: auto;
    border-top: 1px solid var(--borda-fina);
  }
  .livro-card .ações { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }

  .ficha-header {
    background: var(--papel-escuro);
    border: 1px solid var(--borda-fina);
    padding: 32px;
    margin-bottom: 28px;
    display: flex; align-items: center; gap: 24px;
    position: relative;
  }
  .ficha-header::before {
    content: '';
    position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
    border: 1px solid var(--borda-fina);
    pointer-events: none;
  }
  .avatar-grande {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: var(--musgo);
    color: var(--creme-card);
    display: grid; place-items: center;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.9rem;
    flex-shrink: 0;
    border: 2px solid var(--dourado);
  }
  .ficha-header h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 1.7rem;
    color: var(--tinta);
    line-height: 1.2;
  }
  .ficha-header p {
    font-family: var(--serif);
    font-style: italic;
    color: var(--tinta-clara);
    font-size: .95rem;
    margin-top: 4px;
  }
  .ficha-header .matricula-tag {
    display: inline-block;
    font-family: var(--serif);
    font-style: normal;
    font-size: .8rem;
    background: var(--creme-card);
    color: var(--musgo);
    border: 1px solid var(--borda-fina);

<script>
/* ============ BANCO ============ */
const DB = {
  get: (k) => JSON.parse(localStorage.getItem('bib_'+k) || '[]'),
  set: (k, v) => localStorage.setItem('bib_'+k, JSON.stringify(v))
};
let alunos      = DB.get('alunos');
let livros      = DB.get('livros');
let emprestimos = DB.get('emprestimos');
let avaliacoes  = DB.get('avaliacoes');
let solicitacoes = DB.get('solicitacoes');

const salvar = () => {
  DB.set('alunos', alunos);
  DB.set('livros', livros);
  DB.set('emprestimos', emprestimos);
  DB.set('avaliacoes', avaliacoes);

};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const hoje = () => new Date().toISOString().slice(0,10);
const fmtData = (d) => d ? d.split('-').reverse().join('.') : '—';
const estrelas = (n) => '★'.repeat(n) + '☆'.repeat(5-n);
const nomeAluno = (id) => alunos.find(a => a.id === id)?.nome || '—';
const nomeLivro = (id) => livros.find(l => l.id === id)?.titulo || '—';
const iniciais = (nome) => nome.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
const norm = (s) => (s || '').toString().trim().toLowerCase().replace(/\s+/g, ' ');

/* ============ MATRÍCULA ============ */
function proximaMatricula(incluirValorAtual = false) {
  const ano = new Date().getFullYear();
  const regex = new RegExp('^' + ano + '-(\\d{3})$');
  let maior = 0;
  alunos.forEach(a => {
    if (a.matricula) {
      const m = a.matricula.match(regex);
      if (m) maior = Math.max(maior, parseInt(m[1], 10));
    }
  });
  if (incluirValorAtual) {
    const input = document.getElementById('alunoMatricula');
    if (input) {
      const m = input.value.match(regex);
      if (m) maior = Math.max(maior, parseInt(m[1], 10));
    }
  }
  return `${ano}-${String(maior + 1).padStart(3, '0')}`;
}
function regenerarMatricula() {
  const input = document.getElementById('alunoMatricula');
  if (!input) return;
  input.value = proximaMatricula(true);
}

/* ============ SENHA ============ */
const SENHA_KEY = 'bib_senha_bibliotecario';
const SENHA_TENTATIVAS_KEY = 'bib_senha_tentativas';

async function hashSenha(s) {
  const buf = new TextEncoder().encode(s);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function temSenhaSalva() { return !!localStorage.getItem(SENHA_KEY); }
function registrarTentativaErrada() {
  const t = JSON.parse(localStorage.getItem(SENHA_TENTATIVAS_KEY) || '{"n":0,"bloqueadoAte":0}');
  t.n = (t.n || 0) + 1;
  if (t.n >= 5) { t.bloqueadoAte = Date.now() + 60 * 1000; t.n = 0; }
  localStorage.setItem(SENHA_TENTATIVAS_KEY, JSON.stringify(t));
}
function limparTentativas() {
  localStorage.setItem(SENHA_TENTATIVAS_KEY, JSON.stringify({n:0,bloqueadoAte:0}));
}
function estaBloqueado() {
  const t = JSON.parse(localStorage.getItem(SENHA_TENTATIVAS_KEY) || '{"n":0,"bloqueadoAte":0}');
  return t.bloqueadoAte && t.bloqueadoAte > Date.now()
    ? Math.ceil((t.bloqueadoAte - Date.now()) / 1000) : 0;
}

function abrirSenhaBibliotecario() {
  const box = document.getElementById('senhaBox');
  const label = document.getElementById('senhaLabel');
  const btnEsqueci = document.getElementById('btnEsqueci');
  const btnEntrar = document.getElementById('btnSenhaEntrar');
  const perfilGrid = document.getElementById('perfilGrid');
  const erro = document.getElementById('senhaErro');

  perfilGrid.style.display = 'none';
  box.classList.add('ativo');
  erro.style.display = 'none';

  if (temSenhaSalva()) {
    label.textContent = 'Senha do bibliotecário';
    btnEsqueci.style.display = 'inline-block';
    btnEntrar.textContent = 'Entrar';
  } else {
    label.textContent = 'Crie uma senha para o bibliotecário (mín. 4 caracteres)';
    btnEsqueci.style.display = 'none';
    btnEntrar.textContent = 'Criar senha e entrar';
  }
  document.getElementById('senhaInput').value = '';
  setTimeout(() => document.getElementById('senhaInput').focus(), 100);
}

async function confirmarSenhaBibliotecario() {
  const input = document.getElementById('senhaInput');
  const senha = input.value;
  if (senha.length < 4) return mostrarErroSenha('A senha precisa ter pelo menos 4 caracteres.');
  const bloqueio = estaBloqueado();
  if (bloqueio > 0) return mostrarErroSenha(`Muitas tentativas. Aguarde ${bloqueio} segundo(s).`);

  if (!temSenhaSalva()) {
    const hash = await hashSenha(senha);
    localStorage.setItem(SENHA_KEY, hash);
    limparTentativas();
    entrarComoBibliotecario();
    return;
  }
  const hash = await hashSenha(senha);
  if (hash === localStorage.getItem(SENHA_KEY)) {
    limparTentativas();
    entrarComoBibliotecario();
  } else {
    registrarTentativaErrada();
    mostrarErroSenha('Senha incorreta.');
    input.value = '';
    input.focus();
  }
}
function mostrarErroSenha(msg) {
  const erro = document.getElementById('senhaErro');
  erro.textContent = msg;
  erro.style.display = 'block';
}
function resetarSenhaBibliotecario() {
  if (!confirm('Isso vai apagar a senha atual. Na próxima entrada, você poderá criar uma nova senha. Continuar?')) return;
  localStorage.removeItem(SENHA_KEY);
  localStorage.removeItem(SENHA_TENTATIVAS_KEY);
  abrirSenhaBibliotecario();
}
function voltarLogin() {
  document.getElementById('senhaBox').classList.remove('ativo');
  document.getElementById('perfilGrid').style.display = 'grid';
  document.getElementById('senhaErro').style.display = 'none';
  document.getElementById('loginAluno').style.display = 'none';
  document.getElementById('btnEntrarAluno').style.display = 'none';
}

/* ============ TROCAR SENHA (logado) ============ */
function abrirTrocarSenha() {
  document.getElementById('senhaAtualInput').value = '';
  document.getElementById('senhaNovaInput').value = '';
  document.getElementById('senhaConfInput').value = '';
  document.getElementById('trocarSenhaErro').style.display = 'none';
  document.getElementById('modalTrocarSenha').classList.add('ativo');
}
function fecharTrocarSenha() {
  document.getElementById('modalTrocarSenha').classList.remove('ativo');
}
async function salvarNovaSenha() {
  const atual = document.getElementById('senhaAtualInput').value;
  const nova = document.getElementById('senhaNovaInput').value;
  const conf = document.getElementById('senhaConfInput').value;
  const erro = document.getElementById('trocarSenhaErro');
  erro.style.display = 'none';

  if (!temSenhaSalva()) { erro.textContent = 'Não há senha cadastrada.'; erro.style.display = 'block'; return; }
  const hashAtual = await hashSenha(atual);
  if (hashAtual !== localStorage.getItem(SENHA_KEY)) {
    erro.textContent = 'Senha atual incorreta.';
    erro.style.display = 'block';
    return;
  }
  if (nova.length < 4) {
    erro.textContent = 'A nova senha precisa ter pelo menos 4 caracteres.';
    erro.style.display = 'block';
    return;
  }
  if (nova !== conf) {
    erro.textContent = 'As senhas não coincidem.';
    erro.style.display = 'block';
    return;
  }
  localStorage.setItem(SENHA_KEY, await hashSenha(nova));
  limparTentativas();
  fecharTrocarSenha();
  alert('✅ Senha atualizada com sucesso!');
}

/* ============ ESTADO ============ */
let importState = { alunos: null, livros: null };
let sessao = { tipo: null, alunoId: null, pagina: 'painel' };

/* ============ LOGIN ============ */
function escolherPerfil(tipo) {
  if (tipo === 'bibliotecario') return abrirSenhaBibliotecario();

  sel.style.display = 'block';
  btn.style.display = 'block';
}

/* ============ MENUS ============ */
const MENUS = {
  bibliotecario: [

function renderApp() {

  // Botão trocar senha só para bibliotecário

    document.getElementById('userNome').textContent = a ? a.nome : '—';
    document.getElementById('userPerfil').textContent = 'Aluno' + (a?.turma ? ' · '+a.turma : '');
  } else {
    document.getElementById('userAvatar').textContent = 'B';
    document.getElementById('userNome').textContent = 'Bibliotecário(a)';
    document.getElementById('userPerfil').textContent = 'Perfil administrativo';
  }

  const nav = document.getElementById('navMenu');
  const notifBib = pendentesBibliotecario();
  const notifAluno = sessao.tipo === 'aluno' ? pendentesAluno(sessao.alunoId) : 0;

  nav.innerHTML = MENUS[sessao.tipo].map(m => {
    let badge = '';
    if (sessao.tipo === 'bibliotecario' && m.id === 'solicitacoes' && notifBib > 0)
      badge = `<span class="nav-badge">${notifBib}</span>`;
    if (sessao.tipo === 'aluno' && m.id === 'minhasSolic' && notifAluno > 0)
      badge = `<span class="nav-badge">${notifAluno}</span>`;
    return `<button class="nav-item ${sessao.pagina===m.id?'active':''}" onclick="irPara('${m.id}')">
      <span class="simbolo">${m.s}.</span> ${m.label} ${badge}
    </button>`;
  }).join('');

  const main = document.getElementById('mainContent');
  const r = RENDERERS[sessao.tipo]?.[sessao.pagina];
  main.innerHTML = r ? r() : '<p class="empty">Página não encontrada.</p>';

  if (sessao.pagina === 'alunos') {
    const inp = document.getElementById('fileAlunos');
    if (inp) inp.addEventListener('change', (e) => lerCSVAlunos(e));
  }
  if (sessao.pagina === 'livros') {
    const inp = document.getElementById('fileLivros');
    if (inp) inp.addEventListener('change', (e) => lerCSVLivros(e));
  }
}

/* ============ AÇÕES ============ */
function cadastrarAluno() {
  const nome = document.getElementById('alunoNome').value.trim();
  const turma = document.getElementById('alunoTurma').value.trim();
  const inputMat = document.getElementById('alunoMatricula');
  if (!nome) return alert('Informe o nome.');
  let matricula = proximaMatricula();
  let t = 0;
  while (alunos.some(a => a.matricula === matricula) && t < 1000) {
    const ano = new Date().getFullYear();
    const num = parseInt(matricula.split('-')[1], 10) + 1;
    matricula = `${ano}-${String(num).padStart(3, '0')}`;
    t++;
  }
  alunos.push({ id: uid(), nome, turma, matricula });
  document.getElementById('alunoNome').value = '';
  document.getElementById('alunoTurma').value = '';
  if (inputMat) inputMat.value = proximaMatricula();
  salvar();
}
function removerAluno(id) {
  if (emprestimos.some(e => e.alunoId === id && !e.devolvido))
    return alert('Aluno tem empréstimos em aberto.');
  if (!confirm('Remover este aluno?')) return;
  alunos = alunos.filter(a => a.id !== id);
  solicitacoes = solicitacoes.filter(s => s.alunoId !== id);
  salvar();
}
function cadastrarLivro() {
  const isbn = (document.getElementById('livroIsbn')?.value || '').trim();
  const titulo = document.getElementById('livroTitulo').value.trim();
  const autor = document.getElementById('livroAutor').value.trim();
  const genero = document.getElementById('livroGenero').value.trim() || 'Geral';
  const qtd = parseInt(document.getElementById('livroQtd').value) || 1;
  if (!titulo) return alert('Informe o título.');
  if (isbn && livros.some(l => norm(l.isbn) === norm(isbn)))
    return alert('Já existe um livro com este ISBN.');
  if (!isbn && livros.some(l => norm(l.titulo) === norm(titulo) && norm(l.autor) === norm(autor)))
    return alert('Já existe um livro com este título e autor.');
  livros.push({ id: uid(), isbn, titulo, autor, genero, qtd, emprestados: 0 });
  salvar();
}
function removerLivro(id) {
  const l = livros.find(x => x.id === id);
  if (!l) return;
  if (l.emprestados > 0) return alert('Há exemplares emprestados.');
  if (!confirm('Remover este livro?')) return;
  livros = livros.filter(x => x.id !== id);
  avaliacoes = avaliacoes.filter(a => a.livroId !== id);
  solicitacoes = solicitacoes.filter(s => s.livroId !== id);
  salvar();
}
function emprestar() {
  const alunoId = document.getElementById('empAluno').value;
  const livroId = document.getElementById('empLivro').value;
  const data = document.getElementById('empData').value || hoje();
  if (!alunoId || !livroId) return alert('Selecione aluno e livro.');
  const l = livros.find(x => x.id === livroId);
  if (l.emprestados >= l.qtd) return alert('Sem exemplares disponíveis.');
  l.emprestados++;
  emprestimos.push({ id: uid(), alunoId, livroId, data, devolvido: false, dataDev: null });
  salvar();
}
function devolver(empId) {
  const e = emprestimos.find(x => x.id === empId);
  if (!e || e.devolvido) return;
  const l = livros.find(x => x.id === e.livroId);
  if (l) l.emprestados = Math.max(0, l.emprestados - 1);
  e.devolvido = true;
  e.dataDev = hoje();
  salvar();
}
function avaliar(alunoId) {
  const livroId = document.getElementById('avLivro').value;
  const nota = parseInt(document.getElementById('avNota').value);
  const comentario = document.getElementById('avComentario').value.trim();
  if (!livroId) return alert('Selecione um livro.');
  avaliacoes.push({ id: uid(), alunoId, livroId, nota, comentario, data: hoje() });
  salvar();
}

/* ============ SOLICITAÇÕES ============ */
function solicitarEmprestimo(livroId) {
  const alunoId = sessao.alunoId;
  if (!alunoId) return;
  const l = livros.find(x => x.id === livroId);
  if (!l) return;
  const disp = l.qtd - l.emprestados;
  if (disp <= 0) return alert('Este livro está esgotado no momento.');
  if (solicitacoes.some(s => s.alunoId === alunoId && s.livroId === livroId && s.status === 'pendente'))
    return alert('Você já tem uma solicitação pendente para este livro.');
  if (emprestimos.some(e => e.alunoId === alunoId && e.livroId === livroId && !e.devolvido))
    return alert('Você já está com este livro emprestado.');
  solicitacoes.push({ id: uid(), alunoId, livroId, data: hoje(), status: 'pendente', motivo: '', dataResposta: null });
  salvar();
  alert('Solicitação enviada! Aguarde a aprovação do bibliotecário.');
}
function aprovarSolicitacao(solId) {
  const s = solicitacoes.find(x => x.id === solId);
  if (!s || s.status !== 'pendente') return;
  const l = livros.find(x => x.id === s.livroId);
  if (!l || l.emprestados >= l.qtd)
    return alert('Sem exemplares disponíveis para aprovar.');
  l.emprestados++;
  emprestimos.push({ id: uid(), alunoId: s.alunoId, livroId: s.livroId, data: hoje(), devolvido: false, dataDev: null });
  s.status = 'aprovada';
  s.dataResposta = hoje();
  salvar();
}
function recusarSolicitacao(solId) {
  const s = solicitacoes.find(x => x.id === solId);
  if (!s || s.status !== 'pendente') return;
  const motivoInput = document.getElementById('motivo-' + solId);
  const motivo = motivoInput ? motivoInput.value.trim() : '';
  s.status = 'recusada';
  s.motivo = motivo;
  s.dataResposta = hoje();
  salvar();
}

/* ============ CSV ============ */
function parseCSV(texto) {
  if (texto.charCodeAt(0) === 0xFEFF) texto = texto.slice(1);
  const linhas = []; let atual = []; let campo = ''; let dentroAspas = false;
  for (let i = 0; i < texto.length; i++) {
    const c = texto[i]; const prox = texto[i + 1];
    if (c === '"') { if (dentroAspas && prox === '"') { campo += '"'; i++; } else { dentroAspas = !dentroAspas; } }
    else if (c === ',' && !dentroAspas) { atual.push(campo); campo = ''; }
    else if ((c === '\n' || c === '\r') && !dentroAspas) {
      if (c === '\r' && prox === '\n') i++;
      atual.push(campo);
      if (atual.some(x => x.trim() !== '')) linhas.push(atual);
      atual = []; campo = '';
    } else { campo += c; }
  }
  if (campo !== '' || atual.length) { atual.push(campo); if (atual.some(x => x.trim() !== '')) linhas.push(atual); }
  return linhas;
}
function encontrarColuna(cabecalho, nomesAceitos) {
  for (let i = 0; i < cabecalho.length; i++) {
    const h = norm(cabecalho[i]).replace(/[áàâã]/g,'a').replace(/[éê]/g,'e').replace(/[íî]/g,'i').replace(/[óô]/g,'o').replace(/[úû]/g,'u').replace(/ç/g,'c');
    for (const nome of nomesAceitos) if (h === nome) return i;
  }
  return -1;
}

/* ============ IMPORTAR ALUNOS ============ */
function lerCSVAlunos(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const linhas = parseCSV(e.target.result);
      if (linhas.length < 2) { alert('Arquivo vazio ou sem cabeçalho.'); return; }
      const cab = linhas[0];
      const idxNome = encontrarColuna(cab, ['nome','nome completo','aluno']);
      const idxTurma = encontrarColuna(cab, ['turma','classe','serie','série']);
      const idxMat = encontrarColuna(cab, ['matricula','matrícula','mat']);
      if (idxNome === -1) { alert('A coluna "Nome" é obrigatória.'); return; }
      const vistos = new Set();
      const novasLinhas = [];
      for (let i = 1; i < linhas.length; i++) {
        const l = linhas[i];
        const nome = (l[idxNome] || '').trim(); if (!nome) continue;
        const turma = (l[idxTurma] || '').trim();
        const mat = (l[idxMat] || '').trim();
        const chave = norm(nome) + '||' + norm(turma);
        const dupPlanilha = vistos.has(chave);
        const dupBanco = alunos.some(a => norm(a.nome) === norm(nome) && norm(a.turma) === norm(turma));
        let status = 'ok', motivo = '';
        if (dupPlanilha) { status = 'dup'; motivo = 'Repetido na planilha'; }
        else if (dupBanco) { status = 'dup'; motivo = 'Já cadastrado'; }
        if (status === 'ok') vistos.add(chave);
        novasLinhas.push({ nome, turma, matricula: mat, status, motivo });
      }
      importState.alunos = { linhas: novasLinhas, arquivo: file.name };
      renderApp();
    } catch (err) { alert('Erro ao ler: ' + err.message); }
  };
  reader.readAsText(file, 'UTF-8');
  event.target.value = '';
}
function removerLinhaAlunoImport(idx) {
  if (!importState.alunos) return;
  importState.alunos.linhas.splice(idx, 1);
  renderApp();
}
function atualizarTurmaImport(idx, val) {
  if (!importState.alunos) return;
  const l = importState.alunos.linhas[idx];
  l.turma = val;
  const nome = l.nome;
  const dupBanco = alunos.some(a => norm(a.nome) === norm(nome) && norm(a.turma) === norm(val));
  let dupPlanilha = false;
  importState.alunos.linhas.forEach((outra, j) => {
    if (j !== idx && norm(outra.nome) === norm(nome) && norm(outra.turma) === norm(val)) dupPlanilha = true;
  });
  if (dupPlanilha) { l.status = 'dup'; l.motivo = 'Repetido na planilha'; }
  else if (dupBanco) { l.status = 'dup'; l.motivo = 'Já cadastrado'; }
  else { l.status = 'ok'; l.motivo = ''; }
  renderApp();
}
function confirmarImportAlunos() {
  if (!importState.alunos) return;
  const validos = importState.alunos.linhas.filter(l => l.status === 'ok');
  if (!validos.length) return alert('Nenhuma linha válida para importar.');
  validos.forEach(l => {
    let matricula = l.matricula;
    if (!matricula) {
      let t = 0;
      matricula = proximaMatricula();
      while (alunos.some(a => a.matricula === matricula) && t < 1000) {
        const ano = new Date().getFullYear();
        const num = parseInt(matricula.split('-')[1], 10) + 1;
        matricula = `${ano}-${String(num).padStart(3, '0')}`;
        t++;
      }
    }
    alunos.push({ id: uid(), nome: l.nome, turma: l.turma, matricula });
  });
  importState.alunos = null;
  salvar();
  alert(`✅ ${validos.length} aluno(s) importado(s)!`);
}
function cancelarImportAlunos() { importState.alunos = null; renderApp(); }

/* ============ IMPORTAR LIVROS ============ */
function lerCSVLivros(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const linhas = parseCSV(e.target.result);
      if (linhas.length < 2) { alert('Arquivo vazio ou sem cabeçalho.'); return; }
      const cab = linhas[0];
      const idxIsbn = encontrarColuna(cab, ['isbn','isbn13','isbn-13','codigo','código']);
      const idxTitulo = encontrarColuna(cab, ['titulo','título','title']);
      const idxAutor = encontrarColuna(cab, ['autor','author','autores']);
      const idxGenero = encontrarColuna(cab, ['genero','gênero','genre','categoria']);
      const idxQtd = encontrarColuna(cab, ['quantidade','qtd','exemplares','qty']);
      if (idxTitulo === -1) { alert('A coluna "Título" é obrigatória.'); return; }
      const isbnsVistos = new Set();
      const titulosVistos = new Set();
      const novasLinhas = [];
      for (let i = 1; i < linhas.length; i++) {
        const l = linhas[i];
        const titulo = (l[idxTitulo] || '').trim(); if (!titulo) continue;
        const isbn = idxIsbn >= 0 ? (l[idxIsbn] || '').trim() : '';
        const autor = idxAutor >= 0 ? (l[idxAutor] || '').trim() : '';
        const genero = (idxGenero >= 0 ? (l[idxGenero] || '').trim() : '') || 'Geral';
        const qtd = Math.max(1, parseInt(idxQtd >= 0 ? l[idxQtd] : '') || 1);
        const chaveIsbn = norm(isbn);
        const chaveTA = norm(titulo) + '||' + norm(autor);
        let status = 'ok', motivo = '';
        if (isbn && isbnsVistos.has(chaveIsbn)) { status = 'dup'; motivo = 'ISBN repetido na planilha'; }
        else if (!isbn && titulosVistos.has(chaveTA)) { status = 'dup'; motivo = 'Título+autor repetido na planilha'; }
        else if (isbn && livros.some(x => norm(x.isbn) === chaveIsbn)) { status = 'dup'; motivo = 'ISBN já no acervo'; }
        else if (!isbn && livros.some(x => norm(x.titulo) === norm(titulo) && norm(x.autor) === norm(autor))) { status = 'dup'; motivo = 'Título+autor já no acervo'; }
        if (status === 'ok') { if (isbn) isbnsVistos.add(chaveIsbn); else titulosVistos.add(chaveTA); }
        novasLinhas.push({ isbn, titulo, autor, genero, qtd, status, motivo });
      }
      importState.livros = { linhas: novasLinhas, arquivo: file.name };
      renderApp();
    } catch (err) { alert('Erro ao ler: ' + err.message); }
  };
  reader.readAsText(file, 'UTF-8');
  event.target.value = '';
}
function removerLinhaLivroImport(idx) {
  if (!importState.livros) return;
  importState.livros.linhas.splice(idx, 1);
  renderApp();
}
function atualizarGeneroImport(idx, val) {
  if (!importState.livros) return;
  importState.livros.linhas[idx].genero = val || 'Geral';
  renderApp();
}
function atualizarQtdImport(idx, val) {
  if (!importState.livros) return;
  const n = parseInt(val) || 1;
  importState.livros.linhas[idx].qtd = Math.max(1, n);
}
function confirmarImportLivros() {
  if (!importState.livros) return;
  const validos = importState.livros.linhas.filter(l => l.status === 'ok');
  if (!validos.length) return alert('Nenhuma linha válida para importar.');
  validos.forEach(l => {
    livros.push({ id: uid(), isbn: l.isbn, titulo: l.titulo, autor: l.autor, genero: l.genero, qtd: l.qtd, emprestados: 0 });
  });
  importState.livros = null;
  salvar();
  alert(`✅ ${validos.length} livro(s) importado(s)!`);
}
function cancelarImportLivros() { importState.livros = null; renderApp(); }

function baixarArquivo(conteudo, nome) {
  const blob = new Blob([conteudo], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

            <td><strong>${nomeLivro(e.livroId)}</strong></td>
            <td>${fmtData(e.data)}</td>
            <td>${e.devolvido ? '<span class="badge badge-green">Devolvido</span>' : '<span class="badge badge-red">Pendente</span>'}</td>
          </tr>`).join('')}
          </tbody>
        </table>` : '<p class="empty">Sem histórico ainda.</p>'}
    </div>
    <div class="card">
      <div class="card-header"><h2>Avaliações feitas</h2><span class="num">${avals.length}</span></div>
      ${avals.length ? avals.map(a => `
        <div class="avaliacao-item">
          <strong>${nomeLivro(a.livroId)}</strong>
          <div class="stars">${estrelas(a.nota)}</div>
          <p>${a.comentario || '(sem comentário)'}</p>
          <div class="data">${fmtData(a.data)}</div>
        </div>`).join('') : '<p class="empty">Nenhuma avaliação feita.</p>'}
    </div>`;
}
function renderMinhasAvaliacoes(alunoId) {
  const minhas = avaliacoes.filter(a => a.alunoId === alunoId);
  if (!minhas.length) return '<p class="empty">Você ainda não avaliou nenhum livro.</p>';
  return minhas.map(a => `
    <div class="avaliacao-item">
      <strong>${nomeLivro(a.livroId)}</strong>
      <div class="stars">${estrelas(a.nota)}</div>
      <p>${a.comentario || '(sem comentário)'}</p>
      <div class="data">${fmtData(a.data)}</div>
    </div>`).join('');
}
function renderBlocoAvaliacoes() {
  if (!avaliacoes.length) return `<div class="card"><p class="empty">Nenhuma avaliação ainda.</p></div>`;
  const grupos = {};
  avaliacoes.forEach(a => (grupos[a.livroId] = grupos[a.livroId] || []).push(a));
  return Object.keys(grupos).map(lid => {
    const lista = grupos[lid];
    const media = (lista.reduce((s,a)=>s+a.nota,0)/lista.length).toFixed(1);
    return `
      <div class="card">
        <div class="card-header">
          <h2>${nomeLivro(lid)}</h2>
          <span class="num"><span style="color:var(--dourado);letter-spacing:.1em">${estrelas(Math.round(media))}</span> ${media}</span>
        </div>
        ${lista.map(a => `
          <div class="avaliacao-item">
            <strong>${nomeAluno(a.alunoId)}</strong>
            <div class="stars">${estrelas(a.nota)}</div>
            <p>"${a.comentario || 'Sem comentário'}"</p>
            <div class="data">${fmtData(a.data)}</div>
          </div>`).join('')}
      </div>`;
  }).join('');
}
function atualizarFicha() {
  const id = document.getElementById('fichaAluno').value;
  const box = document.getElementById('fichaConteudo');
  if (!id) { box.innerHTML = '<p class="empty">Selecione um aluno.</p>'; return; }
  const a = alunos.find(x => x.id === id);
  if (!a) { box.innerHTML = '<p class="empty">Aluno não encontrado.</p>'; return; }
  box.innerHTML = `
    <div class="ficha-header">
      <div class="avatar-grande">${iniciais(a.nome)}</div>
      <div>
        <h2>${a.nome}</h2>
        <p>${a.turma ? a.turma : 'Turma não informada'}
          ${a.matricula ? `<span class="matricula-tag">${a.matricula}</span>` : ''}
        </p>
      </div>
    </div>
    ${renderFichaAluno(id)}`;
}
</script>
</body>
</html>
